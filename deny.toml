[graph]
all-features = true
exclude-dev = false
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]

[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# This workspace ships under AGPL-3.0-only (LICENSE, LICENSING.md) and every
# member sets `publish = false`, so our own crates are skipped here. The allow
# list below governs *dependencies* only, and deliberately excludes copyleft:
# a GPL/AGPL dependency would belong to its author and could not be covered by
# the commercial license, so it must be a conscious `exceptions` entry.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
