#                       rdirstat — the Tauri desktop shell
#
# A member of the root workspace (see /Cargo.toml, owned by the CONTRACT agent).
# Everything shared — edition, MSRV, version, licence, lints, profiles — is
# inherited, never re-declared here. `src-tauri/src/**` is owned by the app
# author; this manifest is not.

[package]
name = "rdirstat"
description = "RDirStat — disk usage and file inventory for macOS"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[lints]
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rdirstat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri's own crates are pinned here rather than in [workspace.dependencies]
# because no other member links against them.
# No "macos-private-api": `titleBarStyle: "Overlay"` is a public NSWindow
# style and needs no private API. Enabling it would also disable App Store
# eligibility for no gain.
# `tray-icon` is the menu-bar presence (docs/05-UI.md, "Menu bar"); `image-png`
# is what lets `tauri::image::Image::from_bytes` decode the template PNG the
# tray uses. Neither pulls in a private API.
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.4"
# The native folder chooser. Not merely a convenience over typing a path:
# docs/03-MACOS.md#privacy-controls-and-full-disk-access names `NSOpenPanel` as
# the *explicit consent* path for files and folders, so a directory the user
# picked is one macOS has authorised this process to read and a directory they
# typed is not. It also updates Tauri's own filesystem scope. Pulls
# `tauri-plugin-fs` transitively; that plugin's commands are NOT granted in
# `capabilities/default.json`, so the webview gains no filesystem API from it.
tauri-plugin-dialog = "2.7.2"

serde = { workspace = true }
serde_json = { workspace = true }
# The workspace reserves anyhow for rdirstat-cli and src-tauri
# (docs/08-RUST-PRACTICES.md): the shell converts to a typed IPC error at the
# boundary, libraries use thiserror.
anyhow = { workspace = true }

# --- the shared contract; every DTO and error crossing IPC lives here ---
rdirstat-core = { workspace = true }

# --- the `layout` command: squarified treemap / icicle / sunburst + the Arrow
# IPC writer for the schema pinned in rdirstat_core::LAYOUT_COLUMNS. This crate
# owns the tile geometry and the `BinaryResponse`; src-tauri only forwards.
rdirstat-treemap = { workspace = true }

# --- the traversal itself. `src/engine.rs` is now an adapter over this: it
# bridges cancellation, progress, and categorization and owns no walk logic.
rdirstat-scan = { workspace = true }

# --- the taxonomy behind every node's CategoryId. Reached only through
# `engine::ClassifyAdapter`, which joins it to rdirstat-scan's Categorizer seam.
rdirstat-classify = { workspace = true }

# --- typed IPC: `specta` describes the DTOs, `tauri-specta` emits the client ---
specta = { workspace = true }
tauri-specta = { workspace = true }
# The TypeScript emitter behind tauri-specta's `typescript` feature. Pinned
# locally rather than in [workspace.dependencies] because no other member
# links against it; `=0.0.12` is the version tauri-specta 2.0.0-rc.25 depends
# on, and a mismatch would make `Typescript` a different type than the one
# `LanguageExt` is implemented for.
specta-typescript = "=0.0.12"

# NOTE: `arrow` is deliberately NOT a dependency here. The only Arrow writer in
# the app is `rdirstat-treemap`'s, which hands back an already-serialized
# `BinaryResponse`. Re-add it in the same change that makes src-tauri build a
# batch of its own (phase 6 `report` is the likely one).

# --- macOS actions: NSFileManager trashItem, never fs::remove_file ---
trash = { workspace = true }

# --- bounded channels between the reader workers and the single builder ---
crossbeam-channel = { workspace = true }

tracing = { workspace = true }
# Without a subscriber every `tracing::warn!` in this crate is discarded, which
# makes the snapshot store's failure modes — no store, a full disk, an
# unreadable file — completely invisible. `run` installs one.
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# NOTE: there is deliberately no [profile.*] here. Cargo ignores profiles in a
# non-root workspace member; /Cargo.toml sets `lto = "thin"`, `codegen-units = 1`
# and, deliberately, no `panic = "abort"`.
