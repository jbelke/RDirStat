[package]
name = "rdirstat-organize"
description = "Pure planning for backup, migrate, and organize: largest-first fit, disk identity, skip rules, mirror layout, plan tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
globset    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }
toml       = { workspace = true }
# Off by default: the desktop app turns it on to export the profile and
# recommendation types to TypeScript.
specta     = { workspace = true, optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
