[package]
name        = "rdirstat-cli"
description = "Correctness, profiling, and import/export harness for the scanner. A supported surface, not a throwaway."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[lints]
workspace = true

[[bin]]
# NOT "rdirstat": `src-tauri`'s package is also named `rdirstat` and produces a
# bin of that name, so two targets collided on `target/debug/rdirstat` and
# raced each other's output (cargo warns, and says it will become a hard error).
# .settings/docs/01 merges the two into ONE `rdirstat` executable later, at which point
# this crate becomes a library and this section goes away entirely. Until then
# the measurement harness keeps a distinct, webview-free bin name.
name = "rdirstat-cli"
path = "src/main.rs"

[features]
default = []
# Times backup phases and adds the hidden `backup bench` command, for
# scripts/bench-backup.sh. Off in every shipped build.
phase-timing = ["rdirstat-copy/phase-timing"]
# `rdirstat-catalog` is a plain dependency: it writes Parquet with arrow and
# parquet only. DuckDB is never linked; it reads the part files in place.

[dependencies]
rdirstat-core     = { workspace = true }
# The CLI does not reference these three yet. `src/engine.rs` is the swap point
# for `rdirstat-scan`'s supervisor, and `report.rs` is the swap point for
# `rdirstat-classify`'s taxonomy; re-enable each line in the same change that
# starts calling it. Declaring an unused path dependency only couples this
# crate's build to a sibling's compile errors, which is how a measurement
# harness stops being runnable exactly when it is most needed.
# rdirstat-scan     = { workspace = true }
# rdirstat-classify = { workspace = true }
# rdirstat-treemap  = { workspace = true }
# `backup plan` / `backup apply` (.settings/docs/11-ORGANIZE.md, Amendment A).
rdirstat-catalog   = { workspace = true }
rdirstat-copy      = { workspace = true }
rdirstat-organize  = { workspace = true }
# `backup serve`: the job files and /v1 API types, shared with src-tauri.
rdirstat-jobs      = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
hyper              = { workspace = true, features = ["server", "http1"] }
hyper-util         = { workspace = true, features = ["tokio"] }
http-body-util     = { workspace = true }
# gethostname, kill(pid, 0), kern.boottime and setsid for the service lock and
# `--detach`; the audited calls are in `backup/service/sys.rs`.
libc               = { workspace = true }
sha2               = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
crossbeam-channel  = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-chrome     = { workspace = true }

[dev-dependencies]
insta    = { workspace = true }
tempfile = { workspace = true }
