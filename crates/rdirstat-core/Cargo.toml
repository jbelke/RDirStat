[package]
name        = "rdirstat-core"
description = "Immutable arena tree, packed IDs, directory totals, and the shared IPC type contract."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
serde     = { workspace = true }
specta    = { workspace = true }
thiserror = { workspace = true }
# The `*.rdstat` metadata section. The arena travels as fixed-width binary
# sections; only the scan's scalars go through serde, where being
# self-describing is worth more than being compact. This does not make the
# crate an I/O crate: `snapshot` reads and writes `std::io` traits and never
# names a path.
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
