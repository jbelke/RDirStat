[package]
name        = "rdirstat-jobs"
description = "Wire contract of the drive-resident backup service: job files on the drive and the /v1 HTTP API. Types only."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[dependencies]
serde      = { workspace = true }
# Off by default: only the desktop app, which exports TypeScript bindings,
# turns it on.
specta     = { workspace = true, optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
