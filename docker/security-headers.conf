# Included, not inherited.
#
# nginx does not merge `add_header` down into a location that declares one of
# its own — the inner set REPLACES the outer set entirely. Any location below
# that adds a Cache-Control therefore silently drops every security header
# unless it includes this file too. That is the whole reason these three lines
# live in a file instead of at server level.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
