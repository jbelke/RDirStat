# Serves the Stellar RDIRSTAT frontend bundle.
#
# The app is a single page: every route is resolved by the client, so a request
# for a path nginx cannot find is not a 404, it is a deep link. `try_files`
# with an index fallback is the whole routing story.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset it emits, so the hashed files are immutable
    # and index.html must never be, or a deploy is invisible until the browser
    # decides otherwise.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Apache Arrow ships a WASM-free JS build, but the MIME type costs nothing
    # to declare and is the failure that looks like a parser bug.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # This bundle is served for UI work. It has no backend to talk to, so a
    # restrictive policy costs nothing and keeps a staging host from being a
    # convenient place to load someone else's script.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
