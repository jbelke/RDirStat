# Serves the Stellar RDIRSTAT frontend bundle.
#
# The app is a single page: every route is resolved by the client, so a request
# for a path nginx cannot find is not a 404, it is a deep link. `try_files`
# with an index fallback is the whole routing story.
#
# Deliberately NO `types { ... }` block here. Declaring one inside `server`
# REPLACES the inherited map rather than extending it, which serves every file
# in the bundle — index.html included — as application/octet-stream. The base
# image's /etc/nginx/mime.types already covers svg and wasm.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Vite fingerprints every asset it emits, so the hashed files are immutable
    # and index.html must never be, or a deploy is invisible until the browser
    # decides otherwise.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
